<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0a121e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>[hidden]{display:none!important}</style><title>Sabotage Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Layout: full-screen 3D course in golden-hour light. "Broadcast" HUD: one glass top bar (hole + both players),
   a caddie card on the left, map/shop/power-up slots on the right, a club strip along the bottom.
   Single committed dark-glass look over the bright scene. */
:root{
  --glass:rgba(10,18,30,.74); --glass2:rgba(10,18,30,.5); --line:rgba(255,255,255,.16);
  --text:#f4f7fb; --muted:#a6b4c4; --accent:#c8ff3d; --accentD:#7fa80f;
  --p1:#ffb020; --p2:#38c8ff; --buff:#3ee08a; --sab:#ff3b5c; --gold:#ffc940; --goldD:#a8780a;
  --display:'Russo One','Arial Black',system-ui,sans-serif;
  --body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:#2b5f9e;color:var(--text);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
.game{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.gl{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
/* top bar */
.top{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:6px;align-items:stretch}
.hb{display:flex;align-items:center;gap:7px;border-radius:12px;padding:4px 9px 4px 4px;flex:none}
.hb b{font:400 15px/1 var(--display);background:var(--accent);color:#14200a;border-radius:8px;padding:7px 7px 6px}
.hb span{font-weight:800;font-size:13px;letter-spacing:.4px;text-transform:uppercase;line-height:1.15}
.hb span i{display:block;font-style:normal;color:var(--muted);font-size:12px}
#plist{flex:1;display:flex;gap:6px;min-width:0}
.pp{flex:1;min-width:0;border-radius:12px;padding:5px 8px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:6px;align-items:center;opacity:.6;transition:opacity .2s,box-shadow .2s}
.pp.on{opacity:1;box-shadow:inset 0 -3px 0 var(--pc)}
.pp i{width:9px;height:9px;border-radius:50%;background:var(--pc);grid-row:1/3}
.pp .nm{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .sc{font:400 16px/1 var(--display);grid-row:1/3;grid-column:3;font-variant-numeric:tabular-nums}
.pp .cn{grid-column:2}
.pp .cn{display:flex;align-items:center;gap:3px;font-weight:700;font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.coinI{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff4b8,#ffc940 55%,#c98a00);box-shadow:inset 0 0 0 1.5px #8a5e00;flex:none}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--text);flex:none}
.ib svg{width:22px;height:22px}
.ib.on{background:var(--accent);color:#14200a;border-color:var(--accent)}
/* caddie card */
.caddie{position:absolute;left:10px;top:64px;border-radius:14px;padding:9px 12px 10px;min-width:128px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
#iFlag{font:400 28px/1 var(--display);font-variant-numeric:tabular-nums}
#iFlag small{font:700 14px var(--body);color:var(--muted)}
#iElev{font-weight:800;font-size:13px}
.hr{height:1px;background:var(--line);margin:2px 0}
.wind{display:flex;align-items:center;gap:8px}
.dial{width:34px;height:34px;flex:none}
#windTxt{font-weight:800;font-size:14px;line-height:1.1;font-variant-numeric:tabular-nums}
#windTxt small{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-weight:800;font-size:12px;border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.1)}
#shotTxt{font-size:12px;color:var(--muted);font-weight:700}
.tags{position:absolute;left:10px;top:232px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.tag{border-radius:999px;padding:4px 10px 4px 8px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tag span{color:var(--text)}
/* right column */
.rc{position:absolute;right:10px;top:60px;display:flex;flex-direction:column;gap:9px;align-items:center}
.shopB{width:62px;border-radius:16px;cursor:pointer;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--gold);border-color:rgba(255,201,64,.5)}
.shopB svg{width:26px;height:26px}
.shopB .d{display:flex;align-items:center;gap:3px;font:400 13px var(--display);color:var(--text)}
.shopB.can{animation:glow 1.2s ease-in-out infinite}
.shopB[disabled]{opacity:.5;animation:none;cursor:default}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,201,64,.7)}50%{box-shadow:0 0 0 9px rgba(255,201,64,0);border-color:var(--gold)}}
.slot{width:52px;height:52px;border-radius:50%;border:2px dashed rgba(255,255,255,.4);background:var(--glass2);display:grid;place-items:center;cursor:pointer;padding:0}
.slot svg{width:28px;height:28px}
.slot.buff{border:2px solid var(--buff);background:radial-gradient(circle at 50% 35%,#1d6b47,#0d2a1d);box-shadow:0 0 14px rgba(62,224,138,.35)}
.slot.sab{border:2px solid var(--sab);background:radial-gradient(circle at 50% 35%,#7a1a2b,#2a0a12);box-shadow:0 0 14px rgba(255,59,92,.35)}
.slot{position:relative}
.slot.buff,.slot.sab{box-shadow:0 0 0 2px var(--rc) inset,0 0 14px -2px var(--rc)}
.pips{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:var(--glass);border-radius:999px;padding:2px 4px}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.pips.low i{background:var(--sab);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.it .clubic{border-radius:12px;border:2px solid #7fd8ff;background:radial-gradient(circle at 50% 35%,#1d4a6b,#0a1c2a);font:400 15px var(--display);color:#cfefff}
.it .rar{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--rc)}
.lk{font:400 17px var(--display);font-style:italic}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.reel{--rc:#a9b8c8;font:inherit;color:var(--text);border:2px solid var(--rc);border-radius:16px;background:rgba(255,255,255,.04);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:212px;min-width:0;cursor:pointer;box-shadow:0 0 18px -4px var(--rc)}
.reel[disabled]{cursor:default}
.reel .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.reel.buff .ic{background:radial-gradient(circle at 50% 35%,#1d6b47,#0d2a1d)}
.reel.sab .ic{background:radial-gradient(circle at 50% 35%,#7a1a2b,#2a0a12)}
.reel .ic svg{width:30px;height:30px}
.reel .rr{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--rc)}
.reel .t{font:400 14px/1.1 var(--display);text-align:center}
.reel.stop{animation:land .4s cubic-bezier(.2,1.6,.4,1)}
.reel.epic{animation:land .4s cubic-bezier(.2,1.6,.4,1),pulse 1s .4s ease-in-out infinite}
.reel.leg{animation:land .4s cubic-bezier(.2,1.6,.4,1),pulse .6s .4s ease-in-out infinite;background:radial-gradient(circle at 50% 20%,rgba(255,201,64,.35),rgba(255,201,64,.05))}
.reel:not([disabled]):hover{transform:translateY(-3px)}
@keyframes land{from{transform:translateY(-24px) scale(.9)}to{transform:none}}
@keyframes pulse{50%{box-shadow:0 0 30px 2px var(--rc)}}
.pp .cd{width:22px;height:22px;border-radius:50%;grid-row:1/3;display:grid;place-items:center;font:400 9px var(--display);color:#14200a;box-shadow:0 0 0 2px var(--pc);font-style:normal}
.pressB{width:62px;border-radius:14px;cursor:pointer;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--gold);border-color:rgba(255,201,64,.45)}
.pressB b{font:400 12px var(--display);letter-spacing:.8px;color:var(--text)}
.pressB>span{display:flex;align-items:center;gap:3px;font:400 13px var(--display)}
.pressB[disabled]{opacity:.45;cursor:default}
.pressB.used b{color:var(--muted)}
.cads{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cad{font:inherit;color:var(--text);text-align:left;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);padding:10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative;min-width:0}
.cad .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:400 15px var(--display);color:#14200a}
.cad .t{font:400 16px/1.05 var(--display)}
.cad .d{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.25}
.cad[disabled]{opacity:.35;cursor:default}
.cad .tk{position:absolute;right:8px;top:8px;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--sab)}
.cad:not([disabled]):hover{border-color:var(--accent)}
.wheelWrap{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:4px auto;max-width:100%}
.wheel{position:absolute;inset:0;border-radius:50%;border:4px solid #fff;box-shadow:0 0 30px rgba(0,0,0,.4);transition:transform 3.7s cubic-bezier(.12,.75,.12,1);overflow:hidden}
.wheel span{position:absolute;inset:0;display:flex;justify-content:center;padding-top:12%}
.wheel span i{font:400 9.5px var(--display);font-style:normal;color:#0a121e;writing-mode:vertical-rl;letter-spacing:.3px;max-height:38%;text-align:center}
.hub{position:absolute;left:50%;top:50%;width:18%;height:18%;transform:translate(-50%,-50%);border-radius:50%;background:#101b2b;border:3px solid #fff}
.pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);border:12px solid transparent;border-top:22px solid #fff;border-bottom:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.modRes{--mc:#fff;border:2px solid var(--mc);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:center;box-shadow:0 0 22px -4px var(--mc);animation:land .4s cubic-bezier(.2,1.6,.4,1)}
.modRes b{font:400 22px var(--display);color:var(--mc);font-style:italic}
.modRes span{color:var(--text);font-weight:700}
.banner{position:absolute;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.banner span{font-weight:800;font-size:14px;letter-spacing:1.5px;text-transform:uppercase}
.banner b{font:400 clamp(24px,7.2vw,40px)/1.05 var(--display);font-style:italic;text-align:center;padding:0 12px}
.banner small{font-size:12px;color:var(--muted);margin-top:6px}
.banner.go b{animation:popin 4.2s ease-out forwards}
.wr{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:min(340px,calc(100% - 24px));border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:6;border-color:var(--buff)}
.wr>b{font:400 34px/1 var(--display);font-style:italic;color:var(--sab)}
.wr>span{font-weight:700;text-align:center;font-size:14px}
.tug{display:flex;align-items:center;gap:8px;width:100%;font-weight:800;font-size:12px}
.tb{flex:1;height:16px;border-radius:9px;background:var(--sab);overflow:hidden}
.tb i{display:block;height:100%;width:45%;background:var(--accent);transition:width .08s}
#wrTap{width:100%;font:400 24px var(--display);border:0;border-radius:16px;padding:18px;background:var(--accent);color:#14200a;cursor:pointer;touch-action:manipulation}
#wrTap.hit{animation:tap .12s}
@keyframes tap{50%{transform:scale(.94)}}
.cf{position:absolute;transform:translateX(-50%);font:400 18px var(--display);color:var(--gold);text-shadow:0 2px 6px rgba(0,0,0,.7);pointer-events:none;animation:cfl 1.3s ease-out forwards;z-index:4}
@keyframes cfl{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-34px)}}
.rmsg{text-align:center;font-variant-numeric:tabular-nums}
.reel .d{font-size:11.5px;line-height:1.2;color:var(--muted);font-weight:600;text-align:center;flex:1}
.reel .lf{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--accent);background:rgba(200,255,61,.12);border-radius:999px;padding:2px 7px;white-space:nowrap}
.tbar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--sab),#ffe14d,var(--accent))}
.rfx{position:absolute;left:50%;top:30%;transform:translateX(-50%);width:min(320px,calc(100% - 32px));border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:6;border-color:#b25bff;box-shadow:0 0 40px rgba(178,91,255,.5)}
.rfx .rk{font-size:12px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--sab)}
.rfx .rt{font:400 20px var(--display);text-align:center}
.rfx button{display:flex;align-items:center;gap:8px;font:400 22px var(--display);border:0;border-radius:14px;padding:14px 22px;background:#b25bff;color:#fff;cursor:pointer;animation:pulse .5s infinite;--rc:#b25bff}
.rfx button svg{width:28px;height:28px}
.rfx .bar{width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.rfx .bar i{display:block;height:100%;width:100%;background:#b25bff}
.slot.new{animation:cpop .5s cubic-bezier(.2,1.6,.4,1)}
.slot.sel{outline:3px solid var(--accent);outline-offset:3px}
.slot[disabled]{opacity:.5;cursor:default}
@keyframes cpop{from{transform:scale(.3) rotate(-25deg)}to{transform:none}}
.cpop{position:absolute;right:76px;width:210px;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;z-index:3;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.cpop .k{font-size:10.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase}
.cpop .t{font:400 19px/1.05 var(--display)}
.cpop .d{font-size:13.5px;color:var(--muted);font-weight:600;line-height:1.25}
.cpop button{font:400 16px var(--display);border:0;border-radius:10px;padding:9px;color:#fff;cursor:pointer;letter-spacing:.5px}
.cpop button[disabled]{opacity:.5;cursor:default}
/* swing meter + swipe trail */
.meterL{position:absolute;left:14px;bottom:128px;width:12px;height:170px;border-radius:8px;background:var(--glass);border:1px solid var(--line);overflow:hidden}
.meterL .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,var(--accent),#ffe14d 72%,var(--sab) 96%)}
.meterL.shake{animation:shk .08s linear infinite;border-color:var(--sab)}
@keyframes shk{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.meterL .top{position:absolute;left:0;right:0;top:3%;height:2px;background:var(--sab)}
.preadout{position:absolute;left:34px;bottom:128px;font:400 26px var(--display);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);white-space:nowrap;pointer-events:none}
.off{display:none}
#trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#trail polyline{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.85;filter:drop-shadow(0 0 6px rgba(200,255,61,.8))}
#trail.fade polyline{transition:opacity .5s;opacity:0}
#trail.cx polyline{stroke:var(--sab);filter:drop-shadow(0 0 6px rgba(255,59,92,.8))}
.phint{position:absolute;left:34px;bottom:104px;font-weight:800;font-size:12.5px;color:var(--muted);text-shadow:0 1px 4px rgba(0,0,0,.8);pointer-events:none;white-space:nowrap}
.phint.cx{color:var(--sab);font-size:15px}
.chev{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);display:flex;flex-direction:row;align-items:center;gap:10px;pointer-events:none}
.chev .fing{width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(200,255,61,.25);animation:sw 1.8s ease-in-out infinite}
.chev span{font-weight:800;font-size:13px;letter-spacing:.3px;text-shadow:0 1px 4px rgba(0,0,0,.8);white-space:nowrap}
@keyframes sw{0%{transform:translate(0,-10px);opacity:0}15%{opacity:1}50%{transform:translate(0,16px)}80%{transform:translate(8px,-18px)}100%{transform:translate(10px,-24px);opacity:0}}
/* club strip */
.clubs{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:3px;padding:5px;border-radius:18px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.clubs::-webkit-scrollbar{display:none}
.cb .lv{display:flex;gap:2px;margin-top:2px}.cb .lv i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.35}.cb .lv i.on{opacity:1}
.cb{flex:none;width:50px;scroll-snap-align:center;border:0;border-radius:13px;background:transparent;color:var(--text);cursor:pointer;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .15s,transform .15s}
.cb b{font:400 16px/1 var(--display)}
.cb span{font-weight:700;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cb.on{background:var(--accent);color:#14200a;transform:translateY(-4px)}
.cb.on span{color:#2c3a0f}
.cb[disabled]{opacity:.5;cursor:default}
/* on-course markers */
.mk{position:absolute;left:0;top:0;pointer-events:none;font-weight:800;font-size:12.5px;white-space:nowrap;background:var(--glass);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:3px 9px;display:flex;align-items:center;gap:5px}
.mk::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-top-color:rgba(10,18,30,.74);border-bottom:0}
.mk i{width:8px;height:8px;border-radius:50%;display:block}
/* messages */
.toast{position:absolute;left:50%;bottom:146px;transform:translateX(-50%);max-width:calc(100% - 150px);color:var(--text);padding:7px 13px;border-radius:12px;font-weight:700;font-size:13.5px;pointer-events:none;transition:opacity .25s;text-align:center}
.toast.hide{opacity:0}
.pop{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none}
.pop .t{font-family:var(--display);font-size:clamp(32px,10vw,56px);line-height:1;letter-spacing:1px;text-transform:uppercase;font-style:italic;-webkit-text-stroke:3px #0a121e;paint-order:stroke fill;text-shadow:0 0 24px rgba(0,0,0,.35)}
.pop .s{display:inline-block;margin-top:8px;font-weight:800;font-size:14.5px;background:var(--glass);border-radius:999px;padding:4px 12px}
.pop:not(.go){display:none}
.pop.go{animation:popin 1.6s ease-out forwards}
.pop.go.big{animation-duration:2.4s}
@keyframes popin{0%{transform:translateX(-60px) skewX(-12deg);opacity:0}12%{transform:translateX(6px) skewX(-4deg);opacity:1}22%{transform:none}80%{opacity:1}100%{transform:translateX(40px);opacity:0}}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(6,12,22,.6);display:flex;padding:16px;overflow:auto;z-index:5;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;margin:auto;background:#101b2b;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.box h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:.95;margin:0;letter-spacing:.5px;font-style:italic;text-wrap:balance}
.box h1 span{color:var(--sab)}
.box h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;text-wrap:balance}
.box p{margin:0;color:var(--muted);font-size:15px;line-height:1.4;font-weight:600}
.earn{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13.5px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;font-weight:600}
.earn .h{grid-column:1/-1;font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.earn span.r{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
label{font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
input{width:100%}
input{font:inherit;font-size:17px;font-weight:700;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font-family:var(--display);font-size:19px;letter-spacing:.6px;border:0;border-radius:14px;padding:13px;cursor:pointer;background:var(--accent);color:#14200a}
.btn.alt{background:rgba(255,255,255,.09);color:var(--text)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;font-weight:600}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
th{color:var(--muted);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.lb h3{margin:4px 0;font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
/* shop sheet */
.shophd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shophd h2{font-style:italic}
.bal{display:flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font:400 18px var(--display);background:rgba(255,201,64,.14);color:var(--gold)}
.bal .coinI{width:16px;height:16px}
.sect{font-size:11.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it{display:flex;flex-direction:column;gap:5px;border-radius:14px;padding:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);position:relative;min-width:0}
.it .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.it .ic svg{width:28px;height:28px}
.it.buff .ic{border:2px solid var(--buff);background:radial-gradient(circle at 50% 35%,#1d6b47,#0d2a1d)}
.it.sab .ic{border:2px solid var(--sab);background:radial-gradient(circle at 50% 35%,#7a1a2b,#2a0a12)}
.it .t{font:400 16px/1.05 var(--display)}
.it .d{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.25;flex:1}
.it button{display:flex;align-items:center;justify-content:center;gap:5px;font:400 16px var(--display);border:0;border-radius:10px;padding:8px;background:var(--gold);color:#2a1d00;cursor:pointer}
.it button[disabled]{background:rgba(255,255,255,.08);color:var(--muted);cursor:default}
.it .hot{position:absolute;right:8px;top:8px;background:var(--sab);color:#fff;font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 7px;border-radius:999px}
.full{font-size:14px;font-weight:700;color:var(--sab)}
.err{color:var(--sab)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* online play */
.netbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 10px 9px 14px;border-radius:16px;max-width:calc(100% - 20px);z-index:3}
.netbar .nt{display:flex;flex-direction:column;min-width:0}
.netbar .nt b{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.netbar .nt span{font-size:12px;color:var(--muted);font-weight:700}
.netbar button{font:inherit;font-weight:800;font-size:13px;border:0;border-radius:11px;padding:9px 12px;cursor:pointer;background:rgba(255,255,255,.1);color:var(--text);white-space:nowrap}
.netbar button.hi{background:var(--accent);color:#14200a}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:3px;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
.codeChip{font-family:var(--display);font-size:13px;letter-spacing:2px;background:rgba(255,255,255,.1);border-radius:8px;padding:3px 7px;color:var(--gold)}
.netcode{font-family:var(--display);font-size:44px;letter-spacing:10px;text-align:center;color:var(--gold);margin:4px 0}
.games{display:flex;flex-direction:column;gap:6px}
.games button{display:flex;justify-content:space-between;align-items:center;font:inherit;font-weight:700;font-size:14px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left}
.games button small{color:var(--muted);font-weight:700}
.games button .yt{color:var(--accent)}
.lnk{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
body.wait #hand,body.wait #shopbtn,body.wait #pressBtn,body.wait #clubs,body.wait #ghint,body.wait #cpop,body.wait #swingUI{display:none!important}

  for(const w of H.water){

/* ===== physics ===== */
function treeHit(p,b,mine){
  const H=H_();
  for(const t of H.trees){
    const dx=b.x-t.x,dz=b.z-t.z;if(Math.abs(dx)>4.6||Math.abs(dz)>4.6)continue;
    const d=Math.hypot(dx,dz),hy=b.y-t.y,s=t.s;if(hy<0)continue;
    let rad,trunk;
    if(t.type==='acacia'){if(hy>4.4*s)continue;trunk=hy<2.9*s;rad=trunk?.3*s:3.3*s}
    else if(t.type==='palm'){if(hy>8*s)continue;trunk=hy<6.6*s;rad=trunk?.25*s:2.6*s}
    else{if(hy>10*s)continue;trunk=hy<2*s;rad=trunk?.32*s:2.6*s*Math.max(0,1-(hy-2*s)/(8*s))}
    if(d>=rad+R||d<1e-4)continue;
    const nx=dx/d,nz=dz/d,vn=b.vx*nx+b.vz*nz;
    b.x=t.x+nx*(rad+R+.01);b.z=t.z+nz*(rad+R+.01);
    if(vn<0){b.vx-=1.5*vn*nx;b.vz-=1.5*vn*nz;const k=trunk?.6:.3;b.vx*=k;b.vz*=k;b.vy*=trunk?1:.4;
      burst(b.x,b.y,b.z,'#3f9a44',24,4);sfx.tree();G.shake=Math.max(G.shake,.15);if(mine)G.shot.banked=true}
    return;
  }
}
function step(dt){

          b.vx=(b.vx-vn2*n.x)*kk+vn2*n.x;b.vy=(b.vy-vn2*n.y)*kk+vn2*n.y;b.vz=(b.vz-vn2*n.z)*kk+vn2*n.z;b.spinUsed=true;
          const imp=-vn;sfx.thud(imp);if(imp>3){spawnWave(b.x,gy+.04,b.z,sf==='sand'?'#f6e3b0':'#ffffff',1.5+imp*.35);G.shake=Math.max(G.shake,Math.min(.3,imp*.02));burst(b.x,b.y,b.z,sf==='sand'?'#f2dc9e':sf==='green'?'#9de08a':'#8bcf6c',sf==='sand'?40:14,imp*.25)}

/* ===== croc / shark wrestle ===== */
function makeCreature(kind){
  const g=new THREE.Group(),L=c=>new THREE.MeshLambertMaterial({color:c}),segs=[];g.rotation.order='YXZ';
  const blob=(r,sx,sy,sz,col)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),L(col));m.scale.set(sx,sy,sz);return m};
  /* a chain of body segments: each one hangs off the last so the tail can swish */
  const chain=(defs,col,startX)=>{let parent=g,x=startX;defs.forEach(([r,sx,sy,sz,len],i)=>{const sg=new THREE.Group();sg.position.x=i?-len:x;parent.add(sg);
    const m=blob(r,sx,sy,sz,col);m.position.x=-len*.5;sg.add(m);segs.push(sg);parent=sg;x=0});return segs};
  if(kind==='croc'){
    const skin='#3d5a2a',dark='#2c4220',pale='#c9bb84';
    chain([[.42,1.7,.55,.95,.7],[.38,1.6,.52,.85,.7],[.3,1.7,.45,.6,.6],[.22,1.9,.38,.42,.55],[.15,2.1,.3,.28,.5],[.09,2.2,.22,.18,.4]],skin,-.2);
    segs.forEach((sg,i)=>{for(let k=0;k<2;k++){const sc=new THREE.Mesh(new THREE.ConeGeometry(.06-i*.006,.16,4),L(dark));sc.position.set(-.15-k*.3,.17-i*.02,0);sg.add(sc)}});
    for(const [sx,sz] of[[1,1],[1,-1],[-1,1],[-1,-1]]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.16,.12,.42),L(dark));leg.position.set(sx>0?-.15:-.75,-.12,sz*.48);leg.rotation.y=sz*sx*.5;segs[sx>0?0:1].add(leg)}
    const head=new THREE.Group();head.position.x=-.05;g.add(head);
    const skull=blob(.3,1.3,.55,.9,skin);skull.position.x=.25;head.add(skull);
    const snout=new THREE.Mesh(new THREE.BoxGeometry(1,.18,.36),L(skin));snout.position.set(.95,.02,0);snout.geometry.translate(0,0,0);head.add(snout);
    const nose=blob(.1,1,.6,1.6,dark);nose.position.set(1.45,.08,0);head.add(nose);
    const jaw=new THREE.Group();jaw.position.set(.35,-.1,0);head.add(jaw);
    const lj=new THREE.Mesh(new THREE.BoxGeometry(1.15,.09,.34),L(pale));lj.position.x=.55;jaw.add(lj);
    for(let k=0;k<7;k++)for(const sz of[-1,1]){const t1=new THREE.Mesh(new THREE.ConeGeometry(.025,.09,4),new THREE.MeshBasicMaterial({color:'#fffbe8'}));t1.position.set(.15+k*.13,.06,sz*.15);jaw.add(t1);
      const t2=t1.clone();t2.rotation.z=Math.PI;t2.position.set(.55+k*.13,-.11,sz*.16);head.add(t2)}
    for(const sz of[-1,1]){const eye=blob(.09,1,1,1,'#ffd23a');eye.position.set(.45,.2,sz*.14);head.add(eye);const pu=blob(.045,.6,1,1,'#111');pu.position.set(.52,.21,sz*.14);head.add(pu)}
    g.userData={jaw,segs,head};g.scale.setScalar(1.1);
  }else{
    const skin='#6d7f90',pale='#e6edf2';
    chain([[.5,1.6,.75,.8,.9],[.42,1.6,.65,.7,.8],[.3,1.7,.5,.5,.7],[.18,1.9,.35,.3,.6]],skin,-.1);
    const fin=new THREE.Mesh(new THREE.ConeGeometry(.42,1.1,3),L('#5b6c7c'));fin.position.set(-.3,.75,0);fin.rotation.z=-.25;segs[0].add(fin);
    const tail=new THREE.Mesh(new THREE.ConeGeometry(.5,.9,3),L('#5b6c7c'));tail.rotation.z=Math.PI/2;tail.position.set(-.95,.05,0);segs[3].add(tail);
    const head=new THREE.Group();g.add(head);const snout=blob(.42,1.5,.6,.75,skin);snout.position.x=.45;head.add(snout);
    const jaw=new THREE.Group();jaw.position.set(.35,-.2,0);head.add(jaw);const lj=new THREE.Mesh(new THREE.BoxGeometry(.75,.1,.5),L(pale));lj.position.x=.35;jaw.add(lj);
    for(let k=0;k<6;k++){const t1=new THREE.Mesh(new THREE.ConeGeometry(.03,.1,4),new THREE.MeshBasicMaterial({color:'#ffffff'}));t1.position.set(.08+k*.11,.08,(k%2?.14:-.14));jaw.add(t1)}
    for(const sz of[-1,1]){const eye=blob(.06,1,1,1,'#0b0b0b');eye.position.set(.75,.12,sz*.26);head.add(eye)}
    g.userData={jaw,segs,head};g.scale.setScalar(1.15);
  }
  return g;
}
function waterHit(p){

function tickWrestle(dt){
  const W=G.wrestle;if(!W)return;
  const el=(performance.now()-W.t0)/1000;W.v-=dt*(.16+el*.06);
  $('wrBar').style.width=clamp(W.v*100,0,100)+'%';$('wrTime').style.width=clamp(100-el/5.5*100,0,100)+'%';

function endWrestle(win){

  const p=W.p,b=p.ball,H=H_();b.hidden=false;dyn.remove(W.m);burst(W.x,W.y,W.z,'#bfe9ff',60,7,1.4);

function makeBaboon(monkey){
  const g=new THREE.Group(),L=c=>new THREE.MeshLambertMaterial({color:c});
  const body=new THREE.Mesh(new THREE.SphereGeometry(.38,10,8),L(monkey?'#9a9c8c':'#8a7a66'));body.scale.set(1,.85,1.4);body.position.y=.55;g.add(body);

  const face=new THREE.Mesh(new THREE.SphereGeometry(.13,8,6),L(monkey?'#2a2a2a':'#d9a08a'));face.position.set(0,.8,.66);g.add(face);
  const legs=[];for(const [x,z] of[[-.2,.32],[.2,.32],[-.2,-.32],[.2,-.32]]){const l=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.5,6),L('#6f604e'));l.position.set(x,.25,z);g.add(l);legs.push(l)}
  const tail=new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,.7,6),L('#6f604e'));tail.position.set(0,.75,-.65);tail.rotation.x=-.9;g.add(tail);
  g.userData.legs=legs;g.scale.setScalar(monkey?1.7:2.1);return g;
}
function spawnBaboonAt(x,z){const H=H_(),m=makeBaboon(TH(H).critter==='monkey');m.position.set(x,height(H,x,z),z);dyn.add(m);const bb={x,z,home:{x,z},tx:x,tz:z,wait:Math.random()*2,m,phase:'idle'};G.baboons.push(bb);return bb}
function spawnBaboons(H){
  G.baboons.forEach(bb=>dyn.remove(bb.m));G.baboons=[];
  const n=TH(H).baboons;if(!n)return;
  const ax=H.cup[0]-H.tee[0],az=H.cup[1]-H.tee[1],L=Math.hypot(ax,az),ux=ax/L,uz=az/L;
  for(let i=0;i<n;i++){
    for(let tries=0;tries<80;tries++){
      let x,z;
      if(H.par===3){const a=Math.random()*6.283,r=16+Math.random()*14;x=H.cup[0]+Math.cos(a)*r;z=H.cup[1]+Math.sin(a)*r}
      else{const t=.4+Math.random()*.45,side=Math.random()<.5?-1:1,off=side*(H.fw+3+Math.random()*9);x=H.tee[0]+ax*t-uz*off;z=H.tee[1]+az*t+ux*off}
      if(inWater(H,x,z)||x<H.minX+8||x>H.maxX-8||surface(H,x,z)==='green'||G.baboons.some(o=>Math.hypot(o.x-x,o.z-z)<20))continue;
      spawnBaboonAt(x,z);break;
    }
  }
}
function moveBaboon(bb,tx,tz,speed,dt){

  const st=Math.min(d,speed*dt);bb.x+=dx/d*st;bb.z+=dz/d*st;bb.m.rotation.y=Math.atan2(dx,dz);bb.walk=(bb.walk||0)+st*6;return d<.3;
}
function tickBaboons(dt){

function findTheft(){

  for(let i=0;i<600;i++){const s=Math.hypot(vx,vy);vx+=-KD*s*vx*dt;vy+=(-grav()-KD*s*vy+KL*vx*vx*lift)*dt;lift*=Math.exp(-dt*.12);x+=vx*dt;y+=vy*dt;if(y<0&&vy<0)break}return x}

function playReplay(r){return new Promise(res=>{
  const last=Math.max(r.fr.length?r.fr[r.fr.length-1][0]:0,r.ev.length?r.ev[r.ev.length-1].t:0);
  G.rp={r,t:-.4,ei:0,fi:0,res,end:last+1};G.cur=r.who;G.rs=null;snapCam=true;netBar();ui();
})}
function tickReplay(dt){

  while(P.ei<r.ev.length&&r.ev[P.ei].t<=P.t){const e=r.ev[P.ei++];

/* ---- receiving the rival's turn ---- */
async function receive(r,quiet){

    const st=r.state,old=G?G.hole:-1,prev=NET.seq,watch=!quiet&&prev>=0;
    NET.ver=r.version;NET.status=r.status;

    hideOv();document.body.classList.add('wait');
    if(G&&old>=0)for(const x of reps)if(x.hole===old)await playReplay(x);
    const changed=old!==st.hole;
    applyState(st);NET.last=stKey(snap());
    gamesPut({code:NET.code,seat:NET.seat,opp:G.players[1-NET.seat].name,me:G.players[NET.seat].name});
    if(st.over){NET.applying=false;finish();return}
    if(st.mod&&NET.seenHole!==st.hole){
      if(changed&&old>=0&&watch)await holeSummary(old);
      if(watch||NET.seenHole<0){await new Promise(res=>introFly(()=>chaosWheel(res,st.mod)))}
      NET.seenHole=st.hole;
      const late=reps.filter(x=>x.hole===st.hole&&changed);
      for(const x of late)await playReplay(x);

}

    tP.set(mx+Math.sin(p.yaw)*-.01,Math.max(60,d*1.15),mz+Math.cos(p.yaw)*.01+d*.25);tL.set(mx,0,mz);
  }else if(s){
    const b=G.players[s.who].ball,dx=Math.sin(s.dirYaw),dz=-Math.cos(s.dirYaw);

function setLine(line,pts){const a=line.geometry.attributes.position;const n=Math.min(pts.length,a.count);for(let i=0;i<n;i++)a.setXYZ(i,pts[i][0],pts[i][1],pts[i][2]);a.needsUpdate=true;line.geometry.setDrawRange(0,n);line.geometry.computeBoundingSphere()}

}
